<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Московская экскурсия — экспериментальный зин</title>
<meta name="description" content="Экспериментальный зин по путевым заметкам Памелы Трэверс, в котором текст управляет не только взглядом, но и руками читателя">
<meta property="og:title" content="Московская экскурсия">
<meta property="og:description" content="Экспериментальный зин по путевым заметкам Памелы Трэверс">
<meta property="og:image" content="images/01.webp">
<meta name="theme-color" content="#090909">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red:   #fe0000;
    --black: #090909;
    --light: #dddedb;
    --grey:  #c7c7c7;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--black); scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--light);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  #progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: var(--red); z-index: 100;
    transition: width .1s linear;
  }

  .screen { display: block; width: 100%; font-size: 0; }
  .screen img {
    display: block; width: 100%; height: auto;
    background: var(--black);
  }

  .reveal { opacity: 0; transform: translateY(28px); }
  .reveal.in {
    opacity: 1; transform: none;
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }

  .passes {
    position: relative;
    background: var(--black);
    aspect-ratio: 2560 / 1597;
    min-height: 620px;
    display: grid;
    grid-template-columns: 38% 1fr;
    align-items: center;
    gap: 4vw;
    padding: 6vw 5vw 6vw 6.5vw;
    overflow: hidden;
  }
  .passes::after {
    content: ""; position: absolute; top: 0; right: 0;
    width: .55vw; height: 100%; background: var(--red);
  }

  .eyebrow {
    color: var(--red);
    font-size: clamp(9px, .68vw, 14px);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 1.6em;
  }

  .passes h2 {
    font-size: clamp(30px, 4.3vw, 92px);
    line-height: .96;
    font-weight: 800;
    letter-spacing: -.02em;
    color: #fff;
  }

  .caption {
    margin-top: 1.5em;
    max-width: 26em;
    color: var(--grey);
    font-size: clamp(12px, 1.02vw, 21px);
    line-height: 1.45;
    min-height: 3em;
  }

  .list { margin-top: 3vw; border-top: 1px solid #2b2b2b; }
  .pass {
    display: flex; align-items: baseline; gap: 1.6em;
    width: 100%;
    padding: 1.05em .2em;
    border: 0; border-bottom: 1px solid #2b2b2b;
    background: none;
    color: var(--grey);
    font: inherit;
    font-size: clamp(11px, .95vw, 19px);
    text-align: left;
    cursor: pointer;
    transition: color .25s ease, padding-left .25s ease;
  }
  .pass .num { font-variant-numeric: tabular-nums; opacity: .6; }
  .pass:hover { color: #fff; padding-left: .7em; }
  .pass[aria-selected="true"] { color: var(--red); padding-left: .7em; }
  .pass[aria-selected="true"] .num { opacity: 1; }
  .pass:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .sheet {
    position: relative;
    justify-self: center;
    width: min(100%, 38vw);
    aspect-ratio: 1190 / 1684;
    transform: rotate(-2deg);
    box-shadow: 0 3vw 6vw rgba(0,0,0,.75);
    background: #000;
  }
  .sheet img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity .45s ease;
  }
  .sheet img.active { opacity: 1; }

  .hint {
    margin-top: 1.4em;
    font-size: clamp(9px, .62vw, 12px);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #5a5a5a;
  }

  .pull {
    position: relative;
    background: var(--black);
    aspect-ratio: 2560 / 1084;
    min-height: 420px;
    overflow: hidden;
  }

  .topbar {
    position: absolute; top: 0; left: 0; right: .82%;
    height: 7.1%;
    display: flex; align-items: center;
    padding: 0 2.6% 0 3.2%;
    border-bottom: 1px solid #2a2a2a;
    z-index: 2;
  }
  .topbar .mark {
    width: 1.7%; aspect-ratio: 1;
    background: var(--red);
    flex: none;
  }
  .topbar .wordmark {
    margin-left: 1.1%;
    font-size: clamp(7px, .55vw, 12px);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--light);
  }
  .topbar nav {
    margin-left: auto;
    display: flex; gap: 2.2vw;
  }
  .topbar nav a {
    color: var(--light);
    text-decoration: none;
    font-size: clamp(7px, .58vw, 13px);
    opacity: .85;
    transition: color .2s ease, opacity .2s ease;
  }
  .topbar nav a:hover { color: var(--red); opacity: 1; }
  .topbar nav a:focus-visible { outline: 1px solid var(--red); outline-offset: 4px; }

  .pull-top {
    position: absolute; top: 7.1%; left: 0; right: .82%;
    height: 28%;
    padding: 2.8% 2.6% 0 3.2%;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 4vw;
  }
  .pull-top h2 {
    margin-top: .3em;
    font-size: clamp(26px, 5.6vw, 118px);
    line-height: .95;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--light);
    display: flex; align-items: center; gap: .35em;
    white-space: nowrap;
  }
  .pull-arrow {
    display: inline-block;
    transition: transform .35s cubic-bezier(.22,.61,.36,1), opacity .35s ease;
  }
  .pull-note {
    flex: none;
    align-self: flex-end;
    text-align: left;
    font-size: clamp(8px, .72vw, 15px);
    line-height: 1.5;
    color: var(--light);
  }

  .pull-band {
    position: absolute;
    top: 35.06%; left: 0; right: .82%;
    height: 50.28%;
    background: var(--red);
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
  }
  .pull-band.dragging { cursor: grabbing; }
  .pull-band:focus-visible { outline: 2px solid var(--light); outline-offset: -6px; }

  .pull-track {
    position: absolute; top: 50%; left: 0;
    padding: 0 6.4%;
    white-space: nowrap;
    will-change: transform;
    line-height: 1;
    color: var(--grey);
  }
  .pull-track span {
    display: inline-block;
    transform: scaleX(.47);
    transform-origin: left center;
    font-size: 16.5vw;
    font-weight: 500;
    letter-spacing: 0;
  }

  .sidebar {
    position: absolute; top: 0; right: 0;
    width: .82%; height: 100%;
    background: var(--red);
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 1.2% 0;
    z-index: 3;
  }
  .sidebar b, .sidebar i {
    writing-mode: vertical-rl;
    font-style: normal;
    font-size: clamp(6px, .42vw, 10px);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--black);
  }
  .sidebar b { font-weight: 700; }
  .sidebar i { font-weight: 400; }

  @media (max-width: 860px) {
    .pull { aspect-ratio: 2560 / 1500; }
    .pull-top { height: 34%; flex-direction: column; gap: 2vw; padding-top: 6%; }
    .pull-top h2 { font-size: clamp(24px, 8.5vw, 56px); }
    .pull-note { align-self: flex-start; font-size: 11px; }
    .topbar nav { display: none; }
    .pull-track span { font-size: 27vw; }
    .sidebar b, .sidebar i { font-size: 6px; }
  }

  @media (max-width: 860px) {
    .passes {
      aspect-ratio: auto;
      grid-template-columns: 1fr;
      gap: 8vw;
      padding: 16vw 7vw;
    }
    .passes h2 { font-size: clamp(30px, 9vw, 64px); }
    .caption { font-size: 15px; }
    .pass { font-size: 14px; }
    .eyebrow, .hint { font-size: 10px; }
    .sheet { width: 100%; transform: rotate(-1deg); }
  }
</style>
</head>
<body>

<div id="progress"></div>

<main id="stack"></main>

<script>
(() => {
  'use strict';

  const SCREENS = [
    { src: '01.webp', w: 2560, h: 1597 },
    { src: '02.webp', w: 2560, h: 2365 },
    { src: '03.webp', w: 2560, h: 1598 },
    'PASSES',
    { src: '05.webp', w: 2560, h: 1598 },
    { src: '06.webp', w: 2560, h: 2059 },
    { src: '07.webp', w: 2560, h: 1438 },
    { src: '08.webp', w: 2560, h: 1438 },
    { src: '09.webp', w: 2560, h: 1437 },
    'PULL',
    { src: '11.webp', w: 2560, h: 2060 },
    { src: '12.webp', w: 2560, h: 1151 },
    { src: '13.webp', w: 2560, h: 1105 },
    { src: '14.webp', w: 2560, h: 1597 },
  ];

  const PASSES = [
    { n: '01', label: 'Исходный текст', img: 'state-1.webp',
      caption: 'Исходный фрагмент — ещё без готовой идеи и визуальной иерархии' },
    { n: '02', label: 'Действия', img: 'state-5.webp',
      caption: 'Глаголы задают темп: видно, где текст движется, а где замирает' },
    { n: '03', label: 'Прилагательные и наречия', img: 'state-4.webp',
      caption: 'Оценки и оттенки — интонация рассказчицы' },
    { n: '04', label: 'Ключи и крючки', img: 'state-3.webp',
      caption: 'Ручная разметка: ударения, стыки и зацепки для вёрстки' },
    { n: '05', label: 'Только ключевые слова', img: 'state-2.webp',
      caption: 'Остаётся скелет — из него и растёт ритм зина' },
  ];

  const stack = document.getElementById('stack');

  const buildScreen = (s, i) => {
    const wrap = document.createElement('section');
    wrap.className = 'screen reveal';
    const img = document.createElement('img');
    img.src = 'images/' + s.src;
    img.width = s.w;
    img.height = s.h;
    img.alt = 'Экран ' + (i + 1);
    img.loading = i === 0 ? 'eager' : 'lazy';
    img.decoding = 'async';
    wrap.appendChild(img);
    return wrap;
  };

  const buildPasses = () => {
    const sec = document.createElement('section');
    sec.className = 'passes reveal';
    sec.id = 's4';

    const left = document.createElement('div');
    left.innerHTML =
      '<p class="eyebrow">Разобрать до слов</p>' +
      '<h2>Пять проходов<br>по одному тексту</h2>' +
      '<p class="caption" id="passCaption"></p>';

    const list = document.createElement('div');
    list.className = 'list';
    list.setAttribute('role', 'tablist');

    const sheet = document.createElement('div');
    sheet.className = 'sheet';

    const buttons = [];
    const images = [];

    PASSES.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'pass';
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.innerHTML = '<span class="num">' + p.n + '</span><span>' + p.label + '</span>';
      b.addEventListener('click', () => select(i));
      list.appendChild(b);
      buttons.push(b);

      const im = document.createElement('img');
      im.src = 'images/' + p.img;
      im.alt = p.label;
      im.loading = 'lazy';
      im.decoding = 'async';
      sheet.appendChild(im);
      images.push(im);
    });

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = '← → переключают проходы';

    left.appendChild(list);
    left.appendChild(hint);
    sec.appendChild(left);
    sec.appendChild(sheet);

    const caption = left.querySelector('#passCaption');
    let current = -1;

    function select(i) {
      if (i === current) return;
      current = i;
      buttons.forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
      images.forEach((im, k) => im.classList.toggle('active', k === i));
      caption.textContent = PASSES[i].caption;
    }

    list.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const step = e.key === 'ArrowRight' ? 1 : -1;
      const next = (current + step + PASSES.length) % PASSES.length;
      select(next);
      buttons[next].focus();
    });

    select(0);
    return sec;
  };

  const buildTopbar = () => {
    const bar = document.createElement('div');
    bar.className = 'topbar';
    bar.innerHTML =
      '<span class="mark"></span>' +
      '<span class="wordmark">Московская экскурсия</span>' +
      '<nav><a href="#s3">Текст</a><a href="#s4">Идея</a>' +
      '<a href="#s10">Прототип</a><a href="#s14">Результат</a></nav>';
    return bar;
  };

  const buildPull = () => {
    const sec = document.createElement('section');
    sec.className = 'pull reveal';
    sec.id = 's10';

    sec.appendChild(buildTopbar());

    const top = document.createElement('div');
    top.className = 'pull-top';
    top.innerHTML =
      '<div>' +
        '<p class="eyebrow">Самая длинная фраза — самая длинная деталь</p>' +
        '<h2>Потяни вправо <span class="pull-arrow">&#8594;</span></h2>' +
      '</div>' +
      '<p class="pull-note">В интерфейсе — горизонтальный скролл.<br>В зине — бумажная гармошка.</p>';
    sec.appendChild(top);

    const band = document.createElement('div');
    band.className = 'pull-band';
    band.tabIndex = 0;
    band.setAttribute('role', 'slider');
    band.setAttribute('aria-label', 'Потяните, чтобы прочитать фразу целиком');
    band.setAttribute('aria-valuemin', '0');
    band.setAttribute('aria-valuemax', '100');

    const track = document.createElement('div');
    track.className = 'pull-track';
    const phrase = document.createElement('span');
    phrase.textContent = 'ИГРА — НЕ ЗАБАВА, А ПОДГОТОВКА К ТРУДУ';
    track.appendChild(phrase);
    band.appendChild(track);
    sec.appendChild(band);

    const side = document.createElement('div');
    side.className = 'sidebar';
    side.innerHTML = '<b>Пойдёмте!</b><i>03—07</i>';
    sec.appendChild(side);

    const arrow = top.querySelector('.pull-arrow');
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let offset = 0, minOffset = 0;
    let dragging = false, moved = false;
    let startX = 0, startOffset = 0;
    let lastX = 0, lastT = 0, velocity = 0, raf = 0;

    const clamp = (v) => Math.max(minOffset, Math.min(0, v));

    const render = () => {
      track.style.transform = 'translate(' + offset + 'px, -50%)';
      const p = minOffset === 0 ? 0 : offset / minOffset;
      band.setAttribute('aria-valuenow', String(Math.round(p * 100)));
      arrow.style.transform = 'translateX(' + (p * 0.55).toFixed(3) + 'em)';
      arrow.style.opacity = String(1 - p * 0.7);
    };

    const measure = () => {
      const cs = getComputedStyle(track);
      const pads = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const inner = phrase.getBoundingClientRect().width;
      minOffset = Math.min(0, band.clientWidth - inner - pads);
      offset = clamp(offset);
      render();
    };

    const stopInertia = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

    const glide = () => {
      velocity *= 0.94;
      offset = clamp(offset + velocity * 16);
      render();
      if (Math.abs(velocity) > 0.02 && offset > minOffset && offset < 0) {
        raf = requestAnimationFrame(glide);
      } else {
        raf = 0;
      }
    };

    band.addEventListener('pointerdown', (e) => {
      stopInertia();
      dragging = true; moved = false;
      startX = lastX = e.clientX;
      startOffset = offset;
      lastT = e.timeStamp;
      velocity = 0;
      band.setPointerCapture(e.pointerId);
      band.classList.add('dragging');
    });

    band.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 3) moved = true;
      offset = clamp(startOffset + dx);
      const dt = e.timeStamp - lastT;
      if (dt > 0) velocity = (e.clientX - lastX) / dt;
      lastX = e.clientX; lastT = e.timeStamp;
      render();
    });

    const release = (e) => {
      if (!dragging) return;
      dragging = false;
      band.classList.remove('dragging');
      if (e.pointerId !== undefined && band.hasPointerCapture(e.pointerId)) {
        band.releasePointerCapture(e.pointerId);
      }
      if (moved && !calm && Math.abs(velocity) > 0.05) raf = requestAnimationFrame(glide);
    };
    band.addEventListener('pointerup', release);
    band.addEventListener('pointercancel', release);

    band.addEventListener('wheel', (e) => {
      const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);
      if (!dx) return;
      e.preventDefault();
      stopInertia();
      offset = clamp(offset - dx);
      render();
    }, { passive: false });

    band.addEventListener('keydown', (e) => {
      const step = band.clientWidth * 0.25;
      if (e.key === 'ArrowRight') { offset = clamp(offset - step); }
      else if (e.key === 'ArrowLeft') { offset = clamp(offset + step); }
      else if (e.key === 'Home') { offset = 0; }
      else if (e.key === 'End') { offset = minOffset; }
      else return;
      e.preventDefault();
      stopInertia();
      render();
    });

    band.addEventListener('dragstart', (e) => e.preventDefault());
    addEventListener('resize', measure, { passive: true });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    requestAnimationFrame(measure);

    return sec;
  };

  const BUILDERS = { PASSES: buildPasses, PULL: buildPull };

  SCREENS.forEach((s, i) => {
    const node = typeof s === 'string' ? BUILDERS[s]() : buildScreen(s, i);
    if (typeof s !== 'string') node.id = 's' + s.src.slice(0, 2).replace(/^0/, '');
    stack.appendChild(node);
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

  const bar = document.getElementById('progress');
  let ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const max = document.body.scrollHeight - innerHeight;
      bar.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + '%';
      ticking = false;
    });
  }, { passive: true });
})();
</script>

</body>
</html>
